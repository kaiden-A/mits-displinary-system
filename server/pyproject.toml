[project]
name = "app"
version = "0.1.0"
description = "MITS SPSM — FastAPI backend"
readme = "README.md"
authors = [
    { name = "Kaiden-A", email = "amirikhwanfaisal@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "passlib[argon2]>=1.7.4",
    "email-validator>=2.2",
    "alembic>=1.14",
]

[project.scripts]
server = "app:main"

[tool.uv.build-backend]
module-name = "app"
module-root = "."

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
